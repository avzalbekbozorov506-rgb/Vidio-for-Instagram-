<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=720, height=1280" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:720px;height:1280px;overflow:hidden;background:#0b0b0f}
 #root{position:absolute;inset:0;background:#0b0b0f;font-family:"Montserrat",sans-serif}
 #gl{position:absolute;left:0;top:0;width:720px;height:1280px}
 #tag{position:absolute;left:0;top:250px;width:720px;text-align:center;color:#fff;font:800 24px "Montserrat";letter-spacing:.08em;text-transform:uppercase;opacity:.75}
 #sub{position:absolute;left:0;top:1010px;width:720px;text-align:center;color:#fff;font:800 44px/1.1 "Montserrat";text-transform:uppercase;padding:0 50px;text-shadow:0 2px 6px #000}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="720" data-height="1280">
 <canvas id="gl" width="720" height="1280"></canvas>
 <div id="tag" class="clip" data-start="0" data-duration="6" data-track-index="1">Asalari qirolichasi</div>
 <div id="sub" class="clip" data-start="0" data-duration="6" data-track-index="2">Bilasizmi?</div>
</div>
<script type="module">
import * as THREE from "./assets/three.module.min.js";
const W=720,H=1280;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H,false);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd9d2bd);
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,50);
scene.add(new THREE.HemisphereLight(0xfff4de,0x5b6b55,1.1));
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(-2,4,3);key.castShadow=true;scene.add(key);
const M=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
// room
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),M(0xb9b19c));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(10,5),M(0xd8d2bf));wall.position.set(0,2.5,-2.2);scene.add(wall);
const dado=new THREE.Mesh(new THREE.PlaneGeometry(10,1.3),M(0x6d8a6a));dado.position.set(0,.65,-2.19);scene.add(dado);
// board with canvas texture
const c=document.createElement("canvas");c.width=512;c.height=320;const g=c.getContext("2d");
g.fillStyle="#1f4a36";g.fillRect(0,0,512,320);g.fillStyle="#fff";g.font="bold 46px sans-serif";g.fillText("ASALARI",150,110);
g.font="bold 64px sans-serif";g.fillStyle="#ffb400";g.fillText("MALIKA",120,210);
const board=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.6),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(c)}));board.position.set(.9,2.1,-2.15);scene.add(board);
// character
const ch=new THREE.Group();scene.add(ch);
const skin=M(0xf0c9a4,.6),shirt=M(0x9fb39a),pants=M(0x2c3a30),hair=M(0x8d8f86);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.55,8,16),shirt);body.position.y=1.15;ch.add(body);
const head=new THREE.Group();head.position.y=1.95;ch.add(head);
const skull=new THREE.Mesh(new THREE.SphereGeometry(.34,24,24),skin);skull.scale.set(1,1.1,1);head.add(skull);
const hr=new THREE.Mesh(new THREE.SphereGeometry(.35,24,24,0,Math.PI*2,0,Math.PI*.45),hair);hr.position.y=.07;head.add(hr);
for(const x of[-.13,.13]){const e=new THREE.Mesh(new THREE.SphereGeometry(.055,12,12),M(0xffffff,.3));e.position.set(x,.05,.3);head.add(e);
 const p=new THREE.Mesh(new THREE.SphereGeometry(.025,10,10),M(0x222222));p.position.set(x,.05,.35);head.add(p);
 const gl=new THREE.Mesh(new THREE.TorusGeometry(.085,.012,8,24),M(0x222222));gl.position.set(x,.05,.31);head.add(gl);}
const mouth=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),M(0x5a1f1f));mouth.position.set(0,-.14,.31);mouth.scale.set(1.2,.3,.5);head.add(mouth);
const armL=new THREE.Group(),armR=new THREE.Group();armL.position.set(-.42,1.55,0);armR.position.set(.42,1.55,0);ch.add(armL,armR);
for(const a of[armL,armR]){const m=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.55,6,12),shirt);m.position.y=-.32;a.add(m);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.09,12,12),skin);h.position.y=-.68;a.add(h);}
for(const x of[-.15,.15]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.7,6,12),pants);l.position.set(x,.45,0);ch.add(l);}
ch.position.set(-.7,0,0);
ch.traverse(o=>{if(o.isMesh)o.castShadow=true;});
function renderAt(t){
 const talk=Math.max(0,Math.sin(t*14))*(t>.6&&t<5.4?1:0);
 mouth.scale.y=.3+talk*.9;
 head.rotation.y=Math.sin(t*1.6)*.12;head.rotation.z=Math.sin(t*1.1)*.04;
 armR.rotation.z=-.5-Math.sin(t*2.2)*.35;armR.rotation.x=Math.sin(t*1.3)*.2;armL.rotation.z=.18;
 ch.position.y=Math.sin(t*2.2)*.01;
 const k=Math.min(1,t/6);cam.position.set(.6-k*.5,1.5,6.4-k*1.2);cam.lookAt(-.1,1.35,0);
 renderer.render(scene,cam);
}
window.addEventListener("hf-seek",e=>renderAt(e.detail.time));
renderAt(0);
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});tl.fromTo("#sub",{opacity:0},{opacity:1,duration:.3},.4);window.__timelines["main"]=tl;
</script>
</body></html>
