<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=720, height=1280" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:720px;height:1280px;overflow:hidden;background:#0b0b0f}
 #root{position:absolute;inset:0;background:#0b0b0f;font-family:"Montserrat",sans-serif;color:#fff}
 #gl{position:absolute;left:0;top:0;width:720px;height:1280px}
 #series{position:absolute;left:0;top:140px;width:720px;text-align:center;font:800 22px "Montserrat";letter-spacing:.14em;text-transform:uppercase;opacity:.72;text-shadow:0 2px 6px #000}
 #topic{position:absolute;left:0;top:176px;width:720px;text-align:center;font:800 34px "Montserrat";text-transform:uppercase;text-shadow:0 2px 8px #000}
 #sub{position:absolute;left:60px;top:760px;width:600px;text-align:center;font:800 40px/1.12 "Montserrat";text-transform:uppercase;text-shadow:0 2px 8px #000,0 0 3px #000}
 #sub span{color:#fff}#sub span.on{color:#ffb400}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="31" data-width="720" data-height="1280">
 <canvas id="gl" width="720" height="1280"></canvas>
 <div id="series" class="clip" data-start="0" data-duration="31" data-track-index="1">Oddiy mohiyat</div>
 <div id="topic" class="clip" data-start="0" data-duration="31" data-track-index="2">Asalari uyasi</div>
 <div id="sub" class="clip" data-start="0" data-duration="31" data-track-index="3"></div>
</div>
<script type="module">
import * as THREE from "./assets/three.module.min.js";
const W=720,H=1280;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd9d2bd);
const cam=new THREE.PerspectiveCamera(34,W/H,0.1,60);
scene.add(new THREE.HemisphereLight(0xfff4de,0x5b6b55,1.0));
const key=new THREE.DirectionalLight(0xffffff,1.7);key.position.set(-2,5,5);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=5;key.shadow.camera.bottom=-1;scene.add(key);
const M=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r});

// ---------- room ----------
const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,30),M(0xb3ab96));floor.position.z=9;floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(14,6),M(0xdcd6c3));wall.position.set(0,3,-2.4);wall.receiveShadow=true;scene.add(wall);
const dado=new THREE.Mesh(new THREE.PlaneGeometry(14,1.4),M(0x6d8a6a));dado.position.set(0,.7,-2.39);scene.add(dado);
const frame=new THREE.Mesh(new THREE.BoxGeometry(3.5,2.2,.08),M(0x7a5a3a));frame.position.set(0,2.55,-2.36);scene.add(frame);
const bc=document.createElement("canvas");bc.width=640;bc.height=400;const bg=bc.getContext("2d");
const bt=new THREE.CanvasTexture(bc);
const board=new THREE.Mesh(new THREE.PlaneGeometry(3.3,2.0),new THREE.MeshStandardMaterial({map:bt,roughness:.9}));board.position.set(0,2.55,-2.31);scene.add(board);
let boardKey="";
function drawBoard(k){
 if(k===boardKey)return;boardKey=k;
 bg.fillStyle="#1f4a36";bg.fillRect(0,0,640,400);bg.textAlign="center";
 bg.fillStyle="#f2f2f2";bg.font="bold 54px sans-serif";bg.fillText("ASALARI UYASI",320,110);
 if(k==="q"){bg.fillStyle="#ffb400";bg.font="bold 150px sans-serif";bg.fillText("?",320,290);}
 if(k==="king"){bg.fillStyle="#f2f2f2";bg.font="bold 110px sans-serif";bg.fillText("SHOH",320,250);}
 if(k==="queen"){bg.fillStyle="#f2f2f2";bg.font="bold 110px sans-serif";bg.fillText("SHOH",320,250);
   bg.strokeStyle="#ff6a4d";bg.lineWidth=14;bg.beginPath();bg.moveTo(130,200);bg.lineTo(510,250);bg.stroke();
   bg.fillStyle="#ffb400";bg.font="bold 110px sans-serif";bg.fillText("MALIKA",320,370);}
 if(k==="sura"){bg.fillStyle="#ffb400";bg.font="bold 80px sans-serif";bg.fillText("NAHL 16:68",320,260);}
 bt.needsUpdate=true;
}
// ---------- characters ----------
function makeChar(o){
 const g=new THREE.Group();
 const skin=M(o.skin,.6),shirt=M(o.shirt),pants=M(o.pants),hair=M(o.hair,.9),dark=M(0x222222,.4),white=M(0xffffff,.3);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.5,10,20),shirt);torso.position.y=1.2;torso.scale.set(1,1,.8);g.add(torso);
 const collar=new THREE.Mesh(new THREE.TorusGeometry(.17,.035,8,20),shirt);collar.rotation.x=Math.PI/2;collar.position.y=1.66;g.add(collar);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.14,12),skin);neck.position.y=1.72;g.add(neck);
 const head=new THREE.Group();head.position.y=1.98;g.add(head);
 const skull=new THREE.Mesh(new THREE.SphereGeometry(.33,28,28),skin);skull.scale.set(.95,1.08,.98);head.add(skull);
 const cap=new THREE.Mesh(new THREE.SphereGeometry(.345,28,20,0,Math.PI*2,0,Math.PI*(o.hairCov||.46)),hair);cap.position.y=.05;cap.scale.set(.97,1.08,1);cap.rotation.x=-.18;head.add(cap);
 if(o.hairBack){const hb=new THREE.Mesh(new THREE.SphereGeometry(.34,20,16),hair);hb.position.set(0,.02,-.12);hb.scale.set(.98,1.05,.8);head.add(hb);}
 for(const s of[-1,1]){const ear=new THREE.Mesh(new THREE.SphereGeometry(.07,12,12),skin);ear.position.set(s*.31,-.02,0);ear.scale.set(.5,1,.8);head.add(ear);}
 const nose=new THREE.Mesh(new THREE.SphereGeometry(.055,12,12),skin);nose.position.set(0,-.04,.33);nose.scale.set(.9,1.1,1);head.add(nose);
 const eyes=[],lids=[],pupils=[],brows=[];
 for(const s of[-1,1]){
  const e=new THREE.Mesh(new THREE.SphereGeometry(.062,16,16),white);e.position.set(s*.115,.06,.285);e.scale.set(1,1,.6);head.add(e);eyes.push(e);
  const p=new THREE.Mesh(new THREE.SphereGeometry(.03,12,12),dark);p.position.set(s*.115,.06,.322);head.add(p);pupils.push(p);
  const b=new THREE.Mesh(new THREE.BoxGeometry(.11,.022,.03),hair);b.position.set(s*.115,.15,.3);head.add(b);brows.push(b);
  if(o.glasses){const gl=new THREE.Mesh(new THREE.TorusGeometry(.085,.011,8,24),dark);gl.position.set(s*.115,.06,.322);head.add(gl);}
 }
 if(o.glasses){const br=new THREE.Mesh(new THREE.BoxGeometry(.06,.01,.01),dark);br.position.set(0,.065,.325);head.add(br);}
 const mouth=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),M(0x5a1f1f,.5));mouth.position.set(0,-.15,.29);head.add(mouth);
 const smile=new THREE.Mesh(new THREE.TorusGeometry(.075,.011,8,20,Math.PI),M(0x7a3b30,.5));smile.rotation.z=Math.PI;smile.position.set(0,-.12,.31);head.add(smile);
 function arm(side){
  const sh=new THREE.Group();sh.position.set(side*.4,1.52,0);g.add(sh);
  const up=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.3,6,12),shirt);up.position.y=-.2;sh.add(up);
  const el=new THREE.Group();el.position.y=-.4;sh.add(el);
  const lo=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.3,6,12),shirt);lo.position.y=-.2;el.add(lo);
  const hand=new THREE.Group();hand.position.y=-.44;el.add(hand);
  const palm=new THREE.Mesh(new THREE.SphereGeometry(.075,12,12),skin);palm.scale.set(1,1.1,.6);hand.add(palm);
  for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.CapsuleGeometry(.018,.07,4,8),skin);f.position.set((i-1)*.032,-.1,0);hand.add(f);}
  const th=new THREE.Mesh(new THREE.CapsuleGeometry(.02,.05,4,8),skin);th.position.set(side*-.07,-.03,.02);th.rotation.z=side*.7;hand.add(th);
  return{sh,el};
 }
 const aL=arm(-1),aR=arm(1);
 for(const s of[-1,1]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.62,6,12),pants);l.position.set(s*.15,.5,0);g.add(l);
  const sho=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),dark);sho.position.set(s*.15,.06,.05);sho.scale.set(.9,.5,1.3);g.add(sho);}
 g.traverse(m=>{if(m.isMesh)m.castShadow=true;});
 scene.add(g);
 return{g,head,mouth,smile,eyes,pupils,brows,aL,aR,seed:o.seed};
}
const A=makeChar({skin:0xf0c9a4,shirt:0x9fb39a,pants:0x2c3a30,hair:0x8d8f86,glasses:true,seed:1});
const B=makeChar({skin:0xe6b88f,shirt:0xd9a441,pants:0x38404a,hair:0x3a2a22,hairBack:true,hairCov:.52,seed:2});
A.g.position.set(-1.05,0,0);A.g.rotation.y=.55;
B.g.position.set(1.05,0,0);B.g.rotation.y=-.55;

// ---------- dialogue ----------
const RAW=[["A","Asalari uyasini kim boshqaradi?","q"],["B","Shoh, albatta. Asrlar davomida shunday deb o'ylashgan.","king"],["A","Yo'q. Mikroskop paydo bo'lgach, olim asalarining ichini ochdi.","king"],["B","Va nima chiqdi?","king"],["A","Shoh emas, malika.","queen"],["B","Asal yig'adigan ishchi asalarilarning hammasi urg'ochi.","queen"],["A","Nahl surasi, oltmish sakkizinchi oyatda buyruqlar ham urg'ochi shaklida.","sura"],["B","Sizningcha, bu tasodifmi?","sura"]];
const CPS=13,GAP=.4;let tt=.6;
const LINES=RAW.map(([who,text,bd])=>{
 const words=text.split(" ");const tot=text.replace(/ /g,"").length;const d=text.length/CPS;
 let c=tt;const ws=words.map(w=>{const wd=d*(w.length/tot)*(tot/text.length*words.length>0?1:1);return{w,t0:0,t1:0,len:w.length}});
 const sumLen=ws.reduce((a,x)=>a+x.len,0);let cur=tt;
 ws.forEach(x=>{const dd=d*x.len/sumLen;x.t0=cur;x.t1=cur+dd*.88;cur+=dd;});
 const L={who,text,bd,t0:tt,t1:tt+d,words:ws};tt+=d+GAP;return L;});
const wide=(t)=>t<1.4||t>LINES[LINES.length-1].t1+.2;
function lineAt(t){for(const L of LINES)if(t>=L.t0-.05&&t<=L.t1+.25)return L;return null;}
function wordOpen(L,t){
 for(const x of L.words){if(t>=x.t0&&t<x.t1){const u=(t-x.t0)/(x.t1-x.t0);const syl=Math.max(1,Math.round(x.len/3));return Math.pow(Math.abs(Math.sin(Math.PI*u*syl)),.8)*(.6+.4*Math.sin(Math.PI*u));}}
 return 0;}
const hash=(n)=>{let x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x);};
function blink(t,seed){const k=Math.floor(t/2.6);const bt=k*2.6+.4+hash(k+seed*9)*1.6;const d=t-bt;return d>0&&d<.14?Math.sin(d/.14*Math.PI):0;}
function animate(c,other,L,t,talking){
 const open=talking?wordOpen(L,t):0;
 c.mouth.scale.set(1.05-.2*open,.2+open*1.05,.5);c.mouth.position.y=-.15-.01*open;
 c.smile.visible=open<.12;
 const bl=blink(t,c.seed);for(const e of c.eyes)e.scale.y=Math.max(.08,1-bl*.92);for(const p of c.pupils)p.scale.y=Math.max(.08,1-bl*.92);
 const breath=Math.sin(t*1.9+c.seed)*.012;c.g.position.y=breath;
 const sx=c.g.position.x<0?1:-1;
 c.head.rotation.y=-sx*.18+Math.sin(t*1.4+c.seed)*.05;
 c.head.rotation.x=talking?Math.sin(t*5+c.seed)*.03*open-.02:.02;
 c.head.rotation.z=Math.sin(t*1.1+c.seed)*.03;
 for(const p of c.pupils)p.position.x=(p===c.pupils[0]?-.115:.115)-sx*.015;
 const bu=talking?.12+.12*open:0;for(const b of c.brows)b.position.y=.15+bu*.2;
 // arms
 const g=talking?(.5+.5*Math.sin(t*2.4+c.seed*2)):0;
 c.aR.sh.rotation.z=-.15-(talking?.55*g+.15:0);c.aR.sh.rotation.x=talking?-.5*g:0;c.aR.el.rotation.x=talking?-.9*g-.2:-.15;
 c.aL.sh.rotation.z=.15+Math.sin(t*1.2+c.seed)*.02;c.aL.el.rotation.x=-.15;
}
// ---------- shots ----------
const subEl=document.getElementById("sub");let lastSub="";
function renderAt(t){
 const L=lineAt(t);
 animate(A,B,L,t,!!L&&L.who==="A"&&t<=L.t1);
 animate(B,A,L,t,!!L&&L.who==="B"&&t<=L.t1);
 const bd=L?L.bd:(t<1?"q":"sura");drawBoard(bd);
 // camera
 const lt=L?t-L.t0:0;
 if(wide(t)){cam.position.set(0,1.85,11.8-Math.min(1,t/1.4)*.4);cam.lookAt(0,1.55,0);}
 else if(L&&L.who==="A"){cam.position.set(.55-lt*.02,1.9,3.5-lt*.03);cam.lookAt(-1.05,1.82,0);}
 else{cam.position.set(-.55+lt*.02,1.9,3.5-lt*.03);cam.lookAt(1.05,1.82,0);}
 renderer.render(scene,cam);
 // subtitles
 let html="";
 if(L&&t<=L.t1+.2){html=L.words.map(x=>`<span class="${(t>=x.t0&&t<x.t1+.1)?"on":""}">${x.w}</span>`).join(" ");}
 if(html!==lastSub){subEl.innerHTML=html;lastSub=html;}
}
window.addEventListener("hf-seek",e=>renderAt(e.detail.time));
renderAt(0);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=gsap.timeline({paused:true});
</script>
</body></html>
