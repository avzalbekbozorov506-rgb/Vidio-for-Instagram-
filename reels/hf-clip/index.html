<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0b0f}
 #root{position:absolute;inset:0;background:#0b0b0f;font-family:"Montserrat",sans-serif;color:#fff}
 #vid{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
 #shade{position:absolute;left:0;top:1560px;width:1080px;height:360px;background:linear-gradient(to bottom,rgba(11,11,15,0),rgba(11,11,15,.9) 55%,rgba(11,11,15,1) 82%)}
 #tag{position:absolute;left:50%;top:205px;transform:translateX(-50%);padding:14px 36px;border-radius:999px;background:#ffb400;color:#111;font:800 30px "Montserrat";letter-spacing:.12em;white-space:nowrap}
 .sub{position:absolute;left:90px;width:900px;top:1110px;text-align:center;font:800 62px/1.15 "Montserrat";text-transform:uppercase;background:rgba(11,11,15,.72);border-radius:36px;padding:26px 30px;left:110px;width:860px}
 .sub span{color:#fff}.sub span.on{color:#ffb400}
 #handle{position:absolute;left:0;top:1830px;width:1080px;text-align:center;font:800 30px "Montserrat";letter-spacing:.1em;color:#fff;opacity:.9}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
 <video id="vid" class="clip" src="assets/kling.mp4" data-start="0" data-duration="5" data-track-index="0" muted playsinline></video>
 <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="5" data-track-index="9" data-volume="1"></audio>
 <div id="shade" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
 <div id="tag" class="clip" data-start="0" data-duration="5" data-track-index="2">QUR'ON VA FAN</div>
 <div id="s1" class="sub clip" data-start="0.15" data-duration="2.1" data-track-index="3"><span id="w1">Asalari</span> <span id="w2">surasi</span> <span id="w3">bor,</span> <span id="w4">bilasizmi?</span></div>
 <div id="s2" class="sub clip" data-start="3.1" data-duration="1.85" data-track-index="3"><span id="w5">Ha.</span> <span id="w6">Nahl</span> <span id="w7">surasi.</span></div>
 <div id="handle" class="clip" data-start="0" data-duration="5" data-track-index="4">@MOHIYAT___</div>
</div>
<script>
 const tl=gsap.timeline({paused:true});
 const on=(id,a,b)=>{tl.set("#"+id,{color:"#ffb400"},a);tl.set("#"+id,{color:"#ffffff"},b);};
 on("w1",.23,.74);on("w2",.74,1.17);on("w3",1.17,1.46);on("w4",1.46,2.11);
 on("w5",3.15,3.49);on("w6",4.08,4.48);on("w7",4.48,4.95);
 tl.fromTo("#s1",{opacity:0,y:20},{opacity:1,y:0,duration:.2},.15);
 tl.fromTo("#s2",{opacity:0,y:20},{opacity:1,y:0,duration:.2},3.1);
 window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;
</script>
</body></html>
